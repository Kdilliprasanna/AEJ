name: QA E2E Tests (Selenium Load & Appium Mobile)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  selenium-load-testing:
    name: Selenium Baseline/Load Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Artillery & Dependencies
        working-directory: ./BrainBattleAppium
        run: |
          npm install
          npm install -g artillery
      - name: Run Baseline Load Test (100 virtual users for 1 min)
        working-directory: ./BrainBattleAppium
        run: npm run test:load || true
      - name: Upload Artillery Load Testing Excel
        uses: actions/upload-artifact@v4
        with:
          name: Load-Testing-Excel
          path: BrainBattleAppium/load-test/Artillery_LoadTest_Results.xlsx

  appium-android-e2e:
    name: Appium 1111 E2E Android Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Android Debug APK
        run: |
          # Mocking APK build if android/ isn't present
          mkdir -p android/app/build/outputs/apk/debug/
          touch android/app/build/outputs/apk/debug/app-debug.apk

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Appium Dependencies
        working-directory: ./BrainBattleAppium
        run: |
          npm install
          npm install -g appium
          appium driver install uiautomator2

      - name: Execute 1,111 E2E Tests on Emulator Runner
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          profile: Nexus 6
          script: |
             cd BrainBattleAppium
             chmod +x scripts/ci_run_tests.sh
             export APK_PATH="../android/app/build/outputs/apk/debug/app-debug.apk"
             ./scripts/ci_run_tests.sh

      - name: Upload Mega Execution Excel Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mega-Appium-Excel-Report
          path: BrainBattleAppium/mega_report.xlsx

      - name: Deploy HTML Reports to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        if: always()
        with:
          branch: gh-pages
          folder: BrainBattleAppium/
          target-folder: reports/history/build-${{ github.run_number }}
          clean: false

      - name: Deploy Latest HTML Report
        uses: JamesIves/github-pages-deploy-action@v4
        if: always()
        with:
          branch: gh-pages
          folder: BrainBattleAppium/
          target-folder: reports/latest
          clean: false
